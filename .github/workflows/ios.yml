name: iOS

on:
  push:
    branches: [main]
    paths:
      - "iosApp/**"
      - "core/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "iosApp/**"
      - "core/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Compile iOS targets
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: List Gradle projects
        run: gradle projects -PtrimlyIos=true

      - name: Compile core for the iOS simulator
        run: gradle :core:compileKotlinIosSimulatorArm64 -PtrimlyIos=true --stacktrace

      - name: Compile iosApp for the iOS simulator
        run: gradle :iosApp:compileKotlinIosSimulatorArm64 -PtrimlyIos=true --stacktrace

      - name: Link the iOS simulator framework
        run: gradle :iosApp:linkDebugFrameworkIosSimulatorArm64 -PtrimlyIos=true --stacktrace
