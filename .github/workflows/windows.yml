name: Windows

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "app/src/main/java/com/brenninho/trimly/model/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "app/src/main/java/com/brenninho/trimly/model/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows app
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Check desktop module
        shell: pwsh
        run: |
          if (-not (Test-Path desktop/build.gradle.kts)) {
            throw "desktop/build.gradle.kts is missing. Add the desktop folder to the repository."
          }
          $configured = Select-String -Path settings.gradle.kts -Pattern 'trimlyDesktop' -Quiet
          if (-not $configured) {
            Write-Host "settings.gradle.kts does not read trimlyDesktop, adding it for this build"
            $snippet = @'

          if (providers.gradleProperty("trimlyDesktop").isPresent) {
              include(":desktop")
          }
          '@
            Add-Content -Path settings.gradle.kts -Value $snippet
          }
          Get-Content settings.gradle.kts

      - name: List Gradle projects
        run: gradle projects -PtrimlyDesktop=true

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extract
          $ffmpeg = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path desktop/resources/windows | Out-Null
          Copy-Item $ffmpeg.FullName desktop/resources/windows/ffmpeg.exe
          Copy-Item (Join-Path $ffmpeg.DirectoryName "ffprobe.exe") desktop/resources/windows/ffprobe.exe
          Get-ChildItem desktop/resources/windows

      - name: Build portable app
        run: gradle :desktop:createDistributable -PtrimlyDesktop=true --stacktrace

      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path desktop/build/compose/binaries/main/app/Trimly -DestinationPath Trimly-windows.zip

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: Trimly-windows-portable
          path: Trimly-windows.zip
          if-no-files-found: error

      - name: Build installer
        continue-on-error: true
        run: gradle :desktop:packageMsi -PtrimlyDesktop=true --stacktrace

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Trimly-windows-installer
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: ignore
